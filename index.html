<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taobe Mission Control</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a25;
            --bg-card: #1e1e2e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #6a6a7a;
            --border-color: #2a2a3a;
            --accent-purple: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
            --sidebar-width: 240px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Starfield Background */
        .starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        /* Layout */
        .app-container {
            display: flex;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-text {
            font-size: 18px;
            font-weight: 600;
        }

        .logo-subtext {
            font-size: 12px;
            color: var(--text-muted);
        }

        .nav-section {
            padding: 16px 12px;
        }

        .nav-section-title {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            padding: 0 12px;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            margin: 2px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
            text-decoration: none;
        }

        .nav-item:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .nav-item i {
            width: 20px;
            text-align: center;
        }

        .nav-badge {
            margin-left: auto;
            background: var(--accent-red);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
        }

        .page-title {
            font-size: 20px;
            font-weight: 600;
        }

        .header-stats {
            display: flex;
            gap: 24px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .stat-value {
            color: var(--text-primary);
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent-purple);
            color: white;
        }

        .btn-primary:hover {
            background: #7c3aed;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-card);
        }

        /* Content Area */
        .content-area {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Board */
        .board-container {
            flex: 1;
            padding: 24px;
            overflow-x: auto;
        }

        .board {
            display: flex;
            gap: 16px;
            min-width: max-content;
        }

        .column {
            width: 280px;
            background: var(--bg-secondary);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 200px);
        }

        .column-header {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .column-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .column-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .column-dot.recurring { background: var(--accent-blue); }
        .column-dot.backlog { background: var(--text-muted); }
        .column-dot.inprogress { background: var(--accent-yellow); }
        .column-dot.review { background: var(--accent-green); }

        .column-count {
            background: var(--bg-tertiary);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .column-content {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Task Card */
        .task-card {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 14px;
            cursor: grab;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .task-card:hover {
            border-color: var(--border-color);
            transform: translateY(-2px);
        }

        .task-card.dragging {
            opacity: 0.5;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .task-priority {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .priority-high { background: var(--accent-red); }
        .priority-medium { background: var(--accent-yellow); }
        .priority-low { background: var(--accent-green); }

        .task-menu {
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px;
        }

        .task-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .task-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .task-assignee {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .assignee-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
        }

        .assignee-me { background: var(--accent-blue); }
        .assignee-taobe { background: var(--accent-purple); }

        .task-time {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Activity Panel */
        .activity-panel {
            width: 320px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .activity-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .activity-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .activity-title::after {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .activity-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .activity-item {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .activity-text {
            flex: 1;
        }

        .activity-agent {
            font-weight: 600;
            color: var(--accent-purple);
        }

        .activity-action {
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 2px;
        }

        .activity-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow: hidden;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
        }

        .modal-body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--accent-purple);
        }

        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }

        .modal-footer {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .activity-panel {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
            }

            .menu-toggle {
                display: block;
            }

            .header-stats {
                display: none;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>
</head>
<body>
    <!-- Starfield Background -->
    <div class="starfield" id="starfield"></div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div>
                        <div class="logo-text">Mission Control</div>
                        <div class="logo-subtext">Zakir's Dashboard</div>
                    </div>
                </div>
            </div>

            <div class="nav-section">
                <div class="nav-section-title">Overview</div>
                <a href="#" class="nav-item active" data-page="tasks">
                    <i class="fas fa-columns"></i>
                    <span>Task Board</span>
                </a>
                <a href="#" class="nav-item" data-page="calendar">
                    <i class="fas fa-calendar"></i>
                    <span>Calendar</span>
                </a>
                <a href="#" class="nav-item" data-page="projects">
                    <i class="fas fa-folder"></i>
                    <span>Projects</span>
                </a>
            </div>

            <div class="nav-section">
                <div class="nav-section-title">Knowledge</div>
                <a href="#" class="nav-item" data-page="memory">
                    <i class="fas fa-brain"></i>
                    <span>Memories</span>
                </a>
                <a href="#" class="nav-item" data-page="docs">
                    <i class="fas fa-file-alt"></i>
                    <span>Documents</span>
                </a>
            </div>

            <div class="nav-section">
                <div class="nav-section-title">Team</div>
                <a href="#" class="nav-item" data-page="agents">
                    <i class="fas fa-users"></i>
                    <span>Agents</span>
                    <span class="nav-badge">2</span>
                </a>
                <a href="#" class="nav-item" data-page="approvals">
                    <i class="fas fa-check-circle"></i>
                    <span>Approvals</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <button class="menu-toggle" id="menuToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 class="page-title">Task Board</h1>
                </div>
                <div class="header-stats">
                    <div class="stat-item">
                        <i class="fas fa-clock"></i>
                        <span>This week: <span class="stat-value" id="statWeek">0</span></span>
                    </div>
                    <div class="stat-item">
                        <i class="fas fa-spinner"></i>
                        <span>In progress: <span class="stat-value" id="statProgress">0</span></span>
                    </div>
                    <div class="stat-item">
                        <i class="fas fa-check"></i>
                        <span>Completion: <span class="stat-value" id="statCompletion">0%</span></span>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="btn btn-secondary" id="pingTaobe">
                        <i class="fas fa-bell"></i>
                        Ping Taobe
                    </button>
                    <button class="btn btn-primary" id="addTask">
                        <i class="fas fa-plus"></i>
                        New Task
                    </button>
                </div>
            </header>

            <div class="content-area">
                <div class="board-container">
                    <div class="board" id="board">
                        <!-- Columns will be generated by JS -->
                    </div>
                </div>

                <aside class="activity-panel">
                    <div class="activity-header">
                        <div class="activity-title">Live Activity</div>
                    </div>
                    <div class="activity-content" id="activityContent">
                        <!-- Activity items will be generated by JS -->
                    </div>
                </aside>
            </div>
        </main>
    </div>

    <!-- Add Task Modal -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Create New Task</h2>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Task Title</label>
                    <input type="text" class="form-input" id="taskTitle" placeholder="What needs to be done?">
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea class="form-textarea" id="taskDesc" placeholder="Add details..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Assign To</label>
                    <select class="form-select" id="taskAssignee">
                        <option value="me">Me (Z)</option>
                        <option value="taobe">Taobe (AI)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Priority</label>
                    <select class="form-select" id="taskPriority">
                        <option value="high">High</option>
                        <option value="medium" selected>Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Status</label>
                    <select class="form-select" id="taskStatus">
                        <option value="backlog" selected>Backlog</option>
                        <option value="recurring">Recurring</option>
                        <option value="inprogress">In Progress</option>
                        <option value="review">Review</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelTask">Cancel</button>
                <button class="btn btn-primary" id="saveTask">Create Task</button>
            </div>
        </div>
    </div>

    <script>
        // Starfield generation
        function createStarfield() {
            const starfield = document.getElementById('starfield');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starfield.appendChild(star);
            }
        }

        // Sample initial data
        const sampleTasks = [
            { id: 1, title: "Review quarterly reports", desc: "Analyze Q4 financial data", assignee: "me", priority: "high", status: "inprogress", time: "2h ago" },
            { id: 2, title: "Schedule team meeting", desc: "Set up monthly review", assignee: "taobe", priority: "medium", status: "backlog", time: "1d ago" },
            { id: 3, title: "Update documentation", desc: "Mission Control user guide", assignee: "taobe", priority: "low", status: "review", time: "3h ago" },
            { id: 4, title: "Daily standup notes", desc: "Recurring task", assignee: "me", priority: "medium", status: "recurring", time: "Daily" },
            { id: 5, title: "Research AI trends", desc: "Latest developments in AI", assignee: "taobe", priority: "high", status: "backlog", time: "2d ago" },
        ];

        const sampleActivity = [
            { agent: "Taobe", action: "Moved 'Update documentation' to Review", time: "3m ago", avatar: "🤖" },
            { agent: "Taobe", action: "Completed research on AI trends", time: "15m ago", avatar: "🤖" },
            { agent: "You", action: "Created task 'Review quarterly reports'", time: "2h ago", avatar: "Z" },
            { agent: "Taobe", action: "Analyzed yesterday's tasks", time: "4h ago", avatar: "🤖" },
            { agent: "System", action: "Daily backup completed", time: "6h ago", avatar: "⚙️" },
        ];

        // State management
        let tasks = JSON.parse(localStorage.getItem('missionTasks')) || sampleTasks;
        let activity = JSON.parse(localStorage.getItem('missionActivity')) || sampleActivity;

        const columns = {
            recurring: { title: 'Recurring', dot: 'recurring' },
            backlog: { title: 'Backlog', dot: 'backlog' },
            inprogress: { title: 'In Progress', dot: 'inprogress' },
            review: { title: 'Review', dot: 'review' }
        };

        // DOM Elements
        const board = document.getElementById('board');
        const activityContent = document.getElementById('activityContent');
        const taskModal = document.getElementById('taskModal');
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');

        // Initialize
        function init() {
            createStarfield();
            renderBoard();
            renderActivity();
            updateStats();
            setupEventListeners();
        }

        // Render board
        function renderBoard() {
            board.innerHTML = '';
            
            Object.entries(columns).forEach(([key, col]) => {
                const columnEl = document.createElement('div');
                columnEl.className = 'column';
                columnEl.dataset.status = key;
                
                const colTasks = tasks.filter(t => t.status === key);
                
                columnEl.innerHTML = `
                    <div class="column-header">
                        <div class="column-title">
                            <span class="column-dot ${col.dot}"></span>
                            ${col.title}
                        </div>
                        <span class="column-count">${colTasks.length}</span>
                    </div>
                    <div class="column-content" data-status="${key}">
                        ${colTasks.map(task => createTaskCard(task)).join('')}
                    </div>
                `;
                
                board.appendChild(columnEl);
            });

            setupDragAndDrop();
        }

        // Create task card HTML
        function createTaskCard(task) {
            const assigneeClass = task.assignee === 'me' ? 'assignee-me' : 'assignee-taobe';
            const assigneeLabel = task.assignee === 'me' ? 'Z' : 'T';
            const assigneeName = task.assignee === 'me' ? 'You' : 'Taobe';
            
            return `
                <div class="task-card" draggable="true" data-id="${task.id}">
                    <div class="task-header">
                        <span class="task-priority priority-${task.priority}"></span>
                        <span class="task-menu"><i class="fas fa-ellipsis-h"></i></span>
                    </div>
                    <div class="task-title">${task.title}</div>
                    <div class="task-footer">
                        <div class="task-assignee">
                            <div class="assignee-avatar ${assigneeClass}">${assigneeLabel}</div>
                            <span class="task-time">${task.time}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // Render activity
        function renderActivity() {
            activityContent.innerHTML = activity.map(item => `
                <div class="activity-item">
                    <div class="activity-avatar" style="background: ${item.agent === 'Taobe' ? 'var(--accent-purple)' : item.agent === 'You' ? 'var(--accent-blue)' : 'var(--text-muted)'}; color: white;">
                        ${item.avatar}
                    </div>
                    <div class="activity-text">
                        <span class="activity-agent">${item.agent}</span>
                        <div class="activity-action">${item.action}</div>
                        <div class="activity-time">${item.time}</div>
                    </div>
                </div>
            `).join('');
        }

        // Update stats
        function updateStats() {
            const weekTasks = tasks.length;
            const inProgress = tasks.filter(t => t.status === 'inprogress').length;
            const completed = tasks.filter(t => t.status === 'review').length;
            const completionRate = weekTasks > 0 ? Math.round((completed / weekTasks) * 100) : 0;
            
            document.getElementById('statWeek').textContent = weekTasks;
            document.getElementById('statProgress').textContent = inProgress;
            document.getElementById('statCompletion').textContent = completionRate + '%';
        }

        // Drag and drop
        function setupDragAndDrop() {
            const cards = document.querySelectorAll('.task-card');
            const columns = document.querySelectorAll('.column-content');
            
            cards.forEach(card => {
                card.addEventListener('dragstart', () => {
                    card.classList.add('dragging');
                });
                
                card.addEventListener('dragend', () => {
                    card.classList.remove('dragging');
                    saveTasks();
                    addActivity('You', `Moved task to new column`, 'Z');
                });
            });
            
            columns.forEach(col => {
                col.addEventListener('dragover', e => {
                    e.preventDefault();
                    const dragging = document.querySelector('.dragging');
                    if (dragging) {
                        col.appendChild(dragging);
                        const taskId = parseInt(dragging.dataset.id);
                        const task = tasks.find(t => t.id === taskId);
                        if (task) {
                            task.status = col.dataset.status;
                        }
                    }
                });
            });
        }

        // Add new task
        function addTask() {
            const title = document.getElementById('taskTitle').value;
            const desc = document.getElementById('taskDesc').value;
            const assignee = document.getElementById('taskAssignee').value;
            const priority = document.getElementById('taskPriority').value;
            const status = document.getElementById('taskStatus').value;
            
            if (!title) return;
            
            const newTask = {
                id: Date.now(),
                title,
                desc,
                assignee,
                priority,
                status,
                time: 'Just now'
            };
            
            tasks.push(newTask);
            saveTasks();
            renderBoard();
            updateStats();
            closeModal();
            
            const assigneeName = assignee === 'me' ? 'You' : 'Taobe';
            addActivity('You', `Created task "${title}" assigned to ${assigneeName}`, 'Z');
            
            // Reset form
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDesc').value = '';
        }

        // Add activity
        function addActivity(agent, action, avatar) {
            activity.unshift({
                agent,
                action,
                time: 'Just now',
                avatar
            });
            
            if (activity.length > 20) activity.pop();
            
            localStorage.setItem('missionActivity', JSON.stringify(activity));
            renderActivity();
        }

        // Save tasks
        function saveTasks() {
            localStorage.setItem('missionTasks', JSON.stringify(tasks));
        }

        // Modal handlers
        function openModal() {
            taskModal.classList.add('active');
        }

        function closeModal() {
            taskModal.classList.remove('active');
        }

        // Event listeners
        function setupEventListeners() {
            document.getElementById('addTask').addEventListener('click', openModal);
            document.getElementById('closeModal').addEventListener('click', closeModal);
            document.getElementById('cancelTask').addEventListener('click', closeModal);
            document.getElementById('saveTask').addEventListener('click', addTask);
            
            document.getElementById('pingTaobe').addEventListener('click', () => {
                addActivity('You', 'Pinged Taobe for assistance', 'Z');
                setTimeout(() => {
                    addActivity('Taobe', 'Received notification and is ready to help', '🤖');
                }, 1000);
            });
            
            menuToggle.addEventListener('click', () => {
                sidebar.classList.toggle('open');
            });
            
            // Close modal on overlay click
            taskModal.addEventListener('click', (e) => {
                if (e.target === taskModal) closeModal();
            });
            
            // Navigation
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.preventDefault();
                    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                    item.classList.add('active');
                });
            });
        }

        // Start
        init();
    </script>
</body>
</html>
