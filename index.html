<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taobe Mission Control</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a25;
            --bg-card: #1e1e2e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #6a6a7a;
            --border-color: #2a2a3a;
            --accent-purple: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* Stars */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
        }

        /* Layout */
        .container {
            display: flex;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-text {
            font-size: 16px;
            font-weight: 600;
        }

        .logo-sub {
            font-size: 11px;
            color: var(--text-muted);
        }

        .nav-section {
            padding: 16px 12px;
        }

        .nav-title {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-muted);
            padding: 0 12px;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            margin: 2px 0;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s;
        }

        .nav-item:hover, .nav-item.active {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .nav-badge {
            margin-left: auto;
            background: var(--accent-red);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
        }

        /* Main Content */
        .main {
            flex: 1;
            margin-left: 240px;
            display: flex;
            flex-direction: column;
        }

        /* Header - FIXED TO ALWAYS SHOW BUTTONS */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
        }

        .header-center {
            display: flex;
            gap: 20px;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .stat strong {
            color: var(--text-primary);
        }

        /* BUTTONS - ALWAYS VISIBLE */
        .header-buttons {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-purple {
            background: var(--accent-purple);
            color: white;
        }

        .btn-purple:hover {
            background: #7c3aed;
        }

        .btn-gray {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-gray:hover {
            background: var(--bg-card);
        }

        /* Content */
        .content {
            flex: 1;
            padding: 20px;
            overflow: auto;
        }

        /* Board */
        .board {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .column {
            min-width: 260px;
            width: 260px;
            background: var(--bg-secondary);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 140px);
        }

        .column-header {
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .column-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot-blue { background: var(--accent-blue); }
        .dot-gray { background: var(--text-muted); }
        .dot-yellow { background: var(--accent-yellow); }
        .dot-green { background: var(--accent-green); }

        .count {
            background: var(--bg-tertiary);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .column-body {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
        }

        /* Task Card */
        .task {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: grab;
            border: 1px solid transparent;
        }

        .task:hover {
            border-color: var(--border-color);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .priority {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .p-high { background: var(--accent-red); }
        .p-med { background: var(--accent-yellow); }
        .p-low { background: var(--accent-green); }

        .task-title {
            font-size: 13px;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .task-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .assignee {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 600;
        }

        .a-me { background: var(--accent-blue); }
        .a-taobe { background: var(--accent-purple); }

        .time {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Activity Panel */
        .activity {
            width: 300px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .activity-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .activity-title {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .activity-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .activity-item {
            display: flex;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .act-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
        }

        .act-text {
            flex: 1;
        }

        .act-agent {
            font-weight: 600;
            color: var(--accent-purple);
            font-size: 13px;
        }

        .act-desc {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .act-time {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Modal */
        .modal-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-bg.show {
            display: flex;
        }

        .modal-box {
            background: var(--bg-secondary);
            border-radius: 10px;
            width: 90%;
            max-width: 450px;
        }

        .modal-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
        }

        .modal-body {
            padding: 16px;
        }

        .form-row {
            margin-bottom: 14px;
        }

        .form-label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .form-input, .form-select {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 13px;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--accent-purple);
        }

        .modal-footer {
            padding: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* Responsive - FIXED */
        @media (max-width: 1200px) {
            .activity { display: none; }
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main { margin-left: 0; }
            .header { flex-wrap: wrap; }
            .header-center { display: none; }
            /* Buttons stay visible! */
            .header-buttons {
                width: 100%;
                justify-content: flex-end;
                margin-top: 10px;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-tertiary); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">
                        <i class="fas fa-robot" style="color: white; font-size: 16px;"></i>
                    </div>
                    <div>
                        <div class="logo-text">Mission Control</div>
                        <div class="logo-sub">Zakir's Dashboard</div>
                    </div>
                </div>
            </div>

            <div class="nav-section">
                <div class="nav-title">Overview</div>
                <div class="nav-item active" onclick="showPage('tasks')">
                    <i class="fas fa-columns"></i>
                    <span>Task Board</span>
                </div>
                <div class="nav-item" onclick="showPage('calendar')">
                    <i class="fas fa-calendar"></i>
                    <span>Calendar</span>
                </div>
                <div class="nav-item" onclick="showPage('projects')">
                    <i class="fas fa-folder"></i>
                    <span>Projects</span>
                </div>
            </div>

            <div class="nav-section">
                <div class="nav-title">Knowledge</div>
                <div class="nav-item" onclick="showPage('memory')">
                    <i class="fas fa-brain"></i>
                    <span>Memories</span>
                </div>
                <div class="nav-item" onclick="showPage('docs')">
                    <i class="fas fa-file-alt"></i>
                    <span>Documents</span>
                </div>
            </div>

            <div class="nav-section">
                <div class="nav-title">Team</div>
                <div class="nav-item" onclick="showPage('agents')">
                    <i class="fas fa-users"></i>
                    <span>Agents</span>
                    <span class="nav-badge">2</span>
                </div>
                <div class="nav-item" onclick="showPage('approvals')">
                    <i class="fas fa-check-circle"></i>
                    <span>Approvals</span>
                </div>
            </div>
        </aside>

        <!-- Main -->
        <main class="main">
            <header class="header">
                <h1 class="header-title">Task Board</h1>

                <div class="header-center">
                    <div class="stat">
                        <i class="fas fa-clock" style="color: var(--accent-blue);"></i>
                        <span>This week: <strong id="statWeek">5</strong></span>
                    </div>
                    <div class="stat">
                        <i class="fas fa-spinner" style="color: var(--accent-yellow);"></i>
                        <span>In progress: <strong id="statProgress">2</strong></span>
                    </div>
                    <div class="stat">
                        <i class="fas fa-check" style="color: var(--accent-green);"></i>
                        <span>Completion: <strong id="statComplete">40%</strong></span>
                    </div>
                </div>

                <div class="header-buttons">
                    <button class="btn btn-gray" onclick="pingTaobe()">
                        <i class="fas fa-bell"></i>
                        Ping Taobe
                    </button>
                    <button class="btn btn-purple" onclick="openModal()">
                        <i class="fas fa-plus"></i>
                        New Task
                    </button>
                </div>
            </header>

            <div class="content" style="display: flex; gap: 20px;">
                <div class="board" id="board">
                    <!-- Columns generated by JS -->
                </div>

                <aside class="activity">
                    <div class="activity-header">
                        <div class="activity-title">
                            <span class="live-dot"></span>
                            Live Activity
                        </div>
                    </div>
                    <div class="activity-body" id="activityBody">
                        <!-- Activity items -->
                    </div>
                </aside>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal-bg" id="modal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 class="modal-title">Create New Task</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <label class="form-label">Task Title</label>
                    <input type="text" class="form-input" id="taskTitle" placeholder="What needs to be done?">
                </div>
                <div class="form-row">
                    <label class="form-label">Assign To</label>
                    <select class="form-select" id="taskAssignee">
                        <option value="me">Me (Z)</option>
                        <option value="taobe">Taobe (AI)</option>
                    </select>
                </div>
                <div class="form-row">
                    <label class="form-label">Priority</label>
                    <select class="form-select" id="taskPriority">
                        <option value="high">High</option>
                        <option value="medium" selected>Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>
                <div class="form-row">
                    <label class="form-label">Status</label>
                    <select class="form-select" id="taskStatus">
                        <option value="recurring">Recurring</option>
                        <option value="backlog" selected>Backlog</option>
                        <option value="inprogress">In Progress</option>
                        <option value="review">Review</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-gray" onclick="closeModal()">Cancel</button>
                <button class="btn btn-purple" onclick="createTask()">Create Task</button>
            </div>
        </div>
    </div>

    <script>
        // Create stars
        function createStars() {
            const stars = document.getElementById('stars');
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.opacity = Math.random() * 0.5 + 0.1;
                stars.appendChild(star);
            }
        }

        // Sample tasks
        let tasks = [
            { id: 1, title: "Review quarterly reports", priority: "high", status: "inprogress", assignee: "me", time: "2h ago" },
            { id: 2, title: "Schedule team meeting", priority: "medium", status: "backlog", assignee: "taobe", time: "1d ago" },
            { id: 3, title: "Update documentation", priority: "low", status: "review", assignee: "taobe", time: "3h ago" },
            { id: 4, title: "Daily standup notes", priority: "medium", status: "recurring", assignee: "me", time: "Daily" },
            { id: 5, title: "Research AI trends", priority: "high", status: "backlog", assignee: "taobe", time: "2d ago" },
        ];

        // Sample activity
        let activities = [
            { agent: "Taobe", desc: "Moved task to Review", time: "3m ago", icon: "🤖", color: "var(--accent-purple)" },
            { agent: "Taobe", desc: "Completed research task", time: "15m ago", icon: "🤖", color: "var(--accent-purple)" },
            { agent: "You", desc: "Created new task", time: "2h ago", icon: "Z", color: "var(--accent-blue)" },
            { agent: "System", desc: "Daily backup completed", time: "6h ago", icon: "⚙️", color: "var(--text-muted)" },
        ];

        // Render board
        function renderBoard() {
            const columns = {
                recurring: { title: 'Recurring', dot: 'dot-blue' },
                backlog: { title: 'Backlog', dot: 'dot-gray' },
                inprogress: { title: 'In Progress', dot: 'dot-yellow' },
                review: { title: 'Review', dot: 'dot-green' }
            };

            const board = document.getElementById('board');
            board.innerHTML = '';

            for (const [key, col] of Object.entries(columns)) {
                const colTasks = tasks.filter(t => t.status === key);
                const colEl = document.createElement('div');
                colEl.className = 'column';
                
                colEl.innerHTML = `
                    <div class="column-header">
                        <div class="column-title">
                            <span class="dot ${col.dot}"></span>
                            ${col.title}
                        </div>
                        <span class="count">${colTasks.length}</span>
                    </div>
                    <div class="column-body">
                        ${colTasks.map(t => createTaskHTML(t)).join('')}
                    </div>
                `;
                
                board.appendChild(colEl);
            }

            updateStats();
        }

        function createTaskHTML(task) {
            const pClass = task.priority === 'high' ? 'p-high' : task.priority === 'medium' ? 'p-med' : 'p-low';
            const aClass = task.assignee === 'me' ? 'a-me' : 'a-taobe';
            const aLabel = task.assignee === 'me' ? 'Z' : 'T';
            
            return `
                <div class="task">
                    <div class="task-header">
                        <span class="priority ${pClass}"></span>
                        <i class="fas fa-ellipsis-h" style="color: var(--text-muted); cursor: pointer;"></i>
                    </div>
                    <div class="task-title">${task.title}</div>
                    <div class="task-footer">
                        <div class="assignee ${aClass}">${aLabel}</div>
                        <span class="time">${task.time}</span>
                    </div>
                </div>
            `;
        }

        function renderActivity() {
            const body = document.getElementById('activityBody');
            body.innerHTML = activities.map(a => `
                <div class="activity-item">
                    <div class="act-avatar" style="background: ${a.color}; color: white;">${a.icon}</div>
                    <div class="act-text">
                        <div class="act-agent">${a.agent}</div>
                        <div class="act-desc">${a.desc}</div>
                        <div class="act-time">${a.time}</div>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            document.getElementById('statWeek').textContent = tasks.length;
            document.getElementById('statProgress').textContent = tasks.filter(t => t.status === 'inprogress').length;
            const complete = tasks.filter(t => t.status === 'review').length;
            const pct = tasks.length > 0 ? Math.round((complete / tasks.length) * 100) : 0;
            document.getElementById('statComplete').textContent = pct + '%';
        }

        // Modal
        function openModal() {
            document.getElementById('modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
            document.getElementById('taskTitle').value = '';
        }

        function createTask() {
            const title = document.getElementById('taskTitle').value;
            if (!title) return;

            const newTask = {
                id: Date.now(),
                title: title,
                assignee: document.getElementById('taskAssignee').value,
                priority: document.getElementById('taskPriority').value,
                status: document.getElementById('taskStatus').value,
                time: 'Just now'
            };

            tasks.push(newTask);
            renderBoard();
            closeModal();

            // Add activity
            activities.unshift({
                agent: "You",
                desc: `Created task "${title}"`,
                time: "Just now",
                icon: "Z",
                color: "var(--accent-blue)"
            });
            if (activities.length > 10) activities.pop();
            renderActivity();
        }

        function pingTaobe() {
            activities.unshift({
                agent: "You",
                desc: "Pinged Taobe for assistance",
                time: "Just now",
                icon: "Z",
                color: "var(--accent-blue)"
            });
            renderActivity();

            setTimeout(() => {
                activities.unshift({
                    agent: "Taobe",
                    desc: "Received notification and ready to help",
                    time: "Just now",
                    icon: "🤖",
                    color: "var(--accent-purple)"
                });
                renderActivity();
            }, 1000);
        }

        function showPage(page) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            event.target.closest('.nav-item').classList.add('active');
        }

        // Init
        createStars();
        renderBoard();
        renderActivity();
    </script>
</body>
</html>
